[project]
name = "dalal-street-lab"
version = "0.1.0"
description = "A live AI paper-trading system for Indian markets (NSE, Nifty 50, MCX)."
readme = "README.md"
authors = [
    { name = "shlokbhutani", email = "shlokbhutani@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "mlflow>=3.5",
    "pandas>=3.1.0",
    "pandas-market-calendars>=5.5.0",
    "pandera>=0.34.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "scikit-learn>=1.8",
    "sqlalchemy>=2.1.6",
    "structlog>=26.1.0",
    "torch>=2.14.1",
    "transformers>=5.21.0",
    "websockets>=17.3",
]

[project.scripts]
dalal-check = "dalal_street_lab.check:main"
dalal-instruments = "dalal_street_lab.instruments:main"
dalal-backfill = "dalal_street_lab.history:main"
dalal-quality = "dalal_street_lab.quality:main"
dalal-stream = "dalal_street_lab.stream:main"
dalal-watch = "dalal_street_lab.watch:main"
dalal-news = "dalal_street_lab.news:main"
dalal-sentiment = "dalal_street_lab.sentiment:main"
dalal-features = "dalal_street_lab.features:main"
dalal-train = "dalal_street_lab.training:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "responses>=0.26.3",
    "ruff>=0.17.2",
    "types-requests>=2.33.0.20261006",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errors, I: import order, B: likely bugs, UP: modern Python, N: naming, SIM: simpler code
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "pandera.mypy"]

[[tool.mypy.overrides]]
# This library ships without type information, so mypy can't check calls into it.
module = ["pandas_market_calendars", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"  # async test functions just work, no extra decorator needed
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",  # any warning fails the tests, so problems can't hide in the output
    # ...except this one, from inside pandas_market_calendars (their code, harmless today):
    "ignore:Series.dt.weekday is deprecated",
    # ...and this one, from inside MLflow's own database code:
    "ignore:The ``noload`` loader strategy is deprecated",
]
