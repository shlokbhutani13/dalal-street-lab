[project]
name = "dalal-street-lab"
version = "0.1.0"
description = "A live AI paper-trading system for Indian markets (NSE, Nifty 50, MCX)."
readme = "README.md"
authors = [
    { name = "shlokbhutani", email = "shlokbhutani@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "redis>=8.1.0",
    "structlog>=26.1.0",
]

[project.scripts]
dalal-check = "dalal_street_lab.check:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errors, I: import order, B: likely bugs, UP: modern Python, N: naming, SIM: simpler code
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
