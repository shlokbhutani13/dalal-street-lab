name: Deploy checks

# Checks the Kubernetes chart and the Airflow DAG. Nothing is deployed from here.
on:
  push:
    branches: [main]
    paths: ["deploy/**", "airflow/**", ".github/workflows/deploy-checks.yml"]
  pull_request:
    paths: ["deploy/**", "airflow/**", ".github/workflows/deploy-checks.yml"]

permissions:
  contents: read

jobs:
  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Lint the chart
        run: helm lint deploy/helm/dalal-street-lab --strict
      - name: Render it, default settings and with every option switched
        run: |
          helm template dalal deploy/helm/dalal-street-lab > default.yaml
          helm template dalal deploy/helm/dalal-street-lab \
            --set bot.submit=true --set killSwitch=true --set nightly.enabled=false \
            --set stream.enabled=false --set migrations.enabled=false > options.yaml
      - name: Validate against the Kubernetes schemas
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -kubernetes-version 1.33.0 default.yaml options.yaml
      - name: Check the safety settings came through
        run: |
          grep -q 'dalal-bot --model logistic --threshold 0.5"' default.yaml   # dry run by default
          grep -q -- '--submit' options.yaml
          grep -q 'DALAL_KILL_SWITCH: "1"' options.yaml
          test "$(grep -A12 'name: dalal-stream' default.yaml | grep -c 'replicas: 1')" = 1

  airflow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Airflow (pinned with its official constraints)
        run: |
          pip install "apache-airflow==3.1.3" pytest \
            --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.1.3/constraints-3.12.txt
      - name: Test the DAG
        env:
          AIRFLOW_HOME: ${{ runner.temp }}/airflow
        run: python -m pytest -q -c /dev/null airflow/test_dag.py
