# Local services for development. Start: docker compose up -d   Stop: docker compose down
services:
  db:
    image: timescale/timescaledb:latest-pg17   # PostgreSQL 17 + TimescaleDB
    container_name: dalal-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data       # data survives restarts and rebuilds
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: dalal-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Step 13: monitoring. Prometheus at http://localhost:9090, Grafana at http://localhost:3000
  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: dalal-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets Linux reach the laptop like a Mac does
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.1
    container_name: dalal-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # local only: no login needed to look
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  db-data:
